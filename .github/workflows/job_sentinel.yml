name: Job Sentinel - Monitor de Vagas

on:
  schedule:
    # Roda a cada 30 minutos (horário UTC)
    - cron: '*/30 * * * *'
  # Permite rodar manualmente pela aba Actions do GitHub para testar na hora
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar-emails:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar Job Sentinel
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Salvar histórico anônimo (SHA-256)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add processed.txt
          git diff --staged --quiet || git commit -m "chore: atualiza histórico de hashes processados"
          git push